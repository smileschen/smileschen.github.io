<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beta-binomial data generation</title>
<style>
:root{color-scheme:light;--ink:#172e38;--muted:#4e626a;--rule:#c8d4d7;--violet:#714d94;--blue:#216990;--orange:#ad4918}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#f6f8f7;font:16px/1.45 "Source Sans 3","Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1250px;min-height:100vh;margin:auto;padding:20px clamp(18px,3vw,46px) 30px;background:white}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
h1,h2,h3,p{margin:0} h1{font-size:clamp(1.65rem,3.2vw,2.65rem);line-height:1.1;letter-spacing:-.035em}
header p{color:var(--muted);margin-top:8px;max-width:60ch}
nav{display:flex;flex:none;gap:16px;padding-top:7px}nav a{color:var(--muted);font-weight:600;text-decoration:none;border-bottom:2px solid transparent;padding-bottom:4px;white-space:nowrap}
nav a[aria-current=page]{color:var(--blue);border-color:var(--blue)}nav a:hover{text-decoration:underline}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:11px 0;border-bottom:1px solid var(--rule)}
button,select{font:inherit;color:var(--ink);background:white;border:1px solid #a7b9bf;border-radius:4px;padding:5px 12px;cursor:pointer}
button:hover:enabled,select:hover{background:#f0f5f7}button:disabled{color:#79898e;background:#f7f9f9;cursor:default}
#play{color:white;background:var(--blue);border-color:var(--blue);min-width:76px;font-weight:650}#play:hover{background:#184e70}
:focus-visible{outline:3px solid #2975ad;outline-offset:3px}
input[type=range]{flex:1 1 100px;min-width:75px;accent-color:var(--blue);cursor:pointer}
#step{color:var(--muted);font-size:.88rem;min-width:5.6em} .jump{margin-left:5px}
.stage{padding:15px 0 12px}.stage h2{font-size:clamp(1.28rem,2.25vw,1.78rem);line-height:1.2;letter-spacing:-.02em}
.stage p{margin-top:4px;color:var(--muted);min-height:1.5em}
.diagram-view{margin:0 0 12px;font-size:.95rem}.diagram-view summary{width:fit-content;color:var(--blue);font-weight:600;cursor:pointer}
.diagram-scroll{overflow-x:auto}.diagram-view svg{display:block;width:100%;min-width:650px;max-width:990px;height:auto;margin:8px auto}
.diagram-view p{color:var(--muted);margin:3px 0 6px}
.panels,.summary-panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.panel{min-width:0;border-top:3px solid var(--rule);padding-top:8px}
.panel.mode{border-color:var(--violet)}.panel.ability{border-color:var(--blue)}.panel.count{border-color:var(--orange)}
.panel h3{font-size:1.07rem;line-height:1.25}.formula{min-height:1.55em;color:var(--muted);font-size:.94rem}
.figure{width:100%;aspect-ratio:800/365;display:grid;align-content:center;overflow:hidden}
.figure img{display:block;width:100%;height:auto}
.placeholder{font-size:.94rem;color:var(--muted);max-width:25ch;margin:0 auto;text-align:center}
.detail{font-size:.94rem;line-height:1.35;min-height:2.8em;padding-top:5px}
.fixed-shapes{display:flex;justify-content:center;gap:2.5em}.fixed-shapes div{text-align:center}.fixed-shapes small{display:block;color:var(--muted);font-size:.98rem}
.fixed-shapes strong{font-size:clamp(1.8rem,3.2vw,2.8rem);color:var(--violet);font-weight:650;line-height:1.15}
.ledger{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}.ledger h3{font-size:1.06rem;margin-bottom:6px}
.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.95rem}th,td{text-align:right;padding:4px 10px;border-bottom:1px solid #e1e7e8;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}thead th{color:var(--muted);font-weight:600}tbody th{font-weight:500}
td.current{background:#eaf3f7;font-weight:650}td.pending{color:#7d8d92}.summary-panels .detail{min-height:0}
.records{table-layout:fixed}.records th:first-child{width:23%}
.records thead th:not(:first-child),.records td{text-align:center}
.outcomes{display:flex;gap:2px;width:100%;max-width:300px;height:8px;margin-top:3px}
.outcomes span{flex:1;min-width:0;border:1px solid #87999e;border-radius:1px}
.outcomes .hit{background:var(--orange);border-color:var(--orange)}
.count-labels{display:flex;gap:12px}.count-labels span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:4px;border:1px solid #87999e}
.count-labels .hit-key::before{background:var(--orange);border-color:var(--orange)}
[hidden]{display:none!important}
@media(min-width:1550px){main{padding-top:30px}}
@media(max-width:800px){header{display:block}nav{margin-top:10px;padding-top:0}.panels,.summary-panels{gap:12px}.detail,.formula{font-size:.88rem}}
@media(max-width:680px){main{padding:15px 15px 24px}header{padding-bottom:10px}.panels,.summary-panels{grid-template-columns:1fr}.panel{display:grid;column-gap:12px;grid-template-columns:47% 1fr;grid-template-rows:auto auto 1fr;padding:8px 0 3px;align-items:start}
.panel h3,.formula,.detail{grid-column:1}.figure{grid-column:2;grid-row:1 / span 3;align-self:center}.detail{min-height:0}.stage{padding:12px 0}.controls{gap:7px}#seek{order:4;flex:1 1 60%}#step{order:5;min-width:0}
button,select{padding:5px 9px}.jump{margin-left:auto}.fixed-shapes{gap:1.2em}.ledger{margin-top:8px}.summary-panels .panel{grid-template-columns:42% 1fr}th,td{padding:4px 6px}}
@media(max-width:440px){.panels .panel:has(.figure img),.summary-panels .panel{grid-template-columns:1fr}.panel:has(.figure img) .figure,.summary-panels .panel .figure{grid-column:1;grid-row:auto;max-width:420px}.figure:has(.placeholder){aspect-ratio:auto;min-height:60px}.panel h3{font-size:1rem}.detail{padding-top:0}.jump select{max-width:110px}}
</style>

<body>
<main>
<header>
  <div><h1 id="title"></h1><p id="intro"></p></div>
  <nav aria-label="Compare models">
    <a id="navFixed" href="beta_binomial_generation.html">Fixed prior</a>
    <a id="navHier" href="hierarchical_beta_binomial_generation.html">Shared mode</a>
    <a id="navInfer" href="baseball_hierarchical_inference.html">Infer abilities</a>
  </nav>
</header>
<div class="controls" role="group" aria-label="Animation controls">
  <button id="prev" type="button" title="Previous step (left arrow)">Previous</button>
  <button id="play" type="button" title="Play or pause (space)">Play</button>
  <button id="next" type="button" title="Next step (right arrow)">Next</button>
  <input id="seek" type="range" min="1" step="1" value="1" aria-label="Animation step">
  <span id="step"></span>
  <label class="jump"><select id="jump" aria-label="Jump to dataset or summary"></select></label>
</div>
<section class="stage" aria-live="polite" aria-atomic="true"><h2 id="headline"></h2><p id="caption"></p></section>
<details class="diagram-view"><summary>Player branches and plate notation</summary>
  <div class="diagram-scroll">
<svg xmlns="http://www.w3.org/2000/svg" id="generationDiagram" viewBox="0 0 1100 392" width="1100" height="392" role="img" aria-labelledby="modelTitle modelDesc" data-model="hierarchical">
  <title id="modelTitle">The baseball data-generating model, expanded and in plate notation</title>
  <desc id="modelDesc">One population distribution supplies a hit probability for each player. Each at-bat produces a binary observation. The inner plate repeats at-bats and the outer plate repeats players.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52636b"/></marker>
    <style>
      #generationDiagram { background:white; font-family:"Segoe UI",Arial,sans-serif; fill:#1b313a; }
      #generationDiagram text { text-anchor:middle; }
      #generationDiagram .heading {font-size:24px;font-weight:650}
      #generationDiagram .main {font-size:24px} #generationDiagram .small {font-size:18px}
      #generationDiagram .index {font-size:14px}
      #generationDiagram .wire {fill:none;stroke:#52636b;stroke-width:2.0}
      #generationDiagram .edge {fill:none;stroke:#52636b;stroke-width:2.0;marker-end:url(#arrow)}
      #generationDiagram .mode {fill:#f4edf8;stroke:#775795}
      #generationDiagram .shapes {fill:#f8f5fa;stroke:#775795}
      #generationDiagram .ability {fill:#ecf5f9;stroke:#2774a3}
      #generationDiagram .observed {fill:#fff0e2;stroke:#a65328}
      #generationDiagram .node {stroke-width:1.7}
      #generationDiagram .plate {fill:none;stroke:#81949a;stroke-width:1.7}
      #generationDiagram .current .node {stroke-width:4.2}
      #generationDiagram[data-model="fixed"] .hier-only, #generationDiagram[data-model="hierarchical"] .fixed-only {display:none}
    </style>
  </defs>
  <rect width="1100" height="392" fill="white"/>
  <path d="M685 11 V381" stroke="#d6dfe2" stroke-width="2"/>
  <text x="337" y="27" class="heading">Four player branches</text>
  <text x="891" y="27" class="heading">The same model in plates</text>
  <g data-layer="mode">
    <rect class="node mode" x="194" y="41" width="282" height="43" rx="21"/>
    <text class="main hier-only" x="335" y="70">ω ∼ Beta(3, 7)</text>
    <text class="main fixed-only" x="335" y="70">α = 81,  β = 219</text>
    <rect class="node mode" x="768" y="41" width="246" height="43" rx="21"/>

  <g data-layer="population">
    <rect class="node shapes" x="91" y="108" width="488" height="66" rx="7"/>
    <text class="main hier-only" x="335" y="136">α = 1 + 298ω,   β = 1 + 298(1 − ω)</text>
    <text class="main fixed-only" x="335" y="136">The shapes stay fixed in every dataset</text>
    <text class="small" x="335" y="162">One shared Beta(α, β) distribution</text>
    <rect class="node shapes" x="770" y="108" width="242" height="42" rx="7"/>
    <text class="main hier-only" x="891" y="136">α(ω), β(ω)</text>
    <text class="main fixed-only" x="891" y="136">Fixed shapes α, β</text>
  </g>
  <path class="wire" d="M335 174 V191 M82 191 H589"/>
  <path class="edge" d="M82 191 V211"/><path class="edge" d="M251 191 V211"/>
  <path class="edge" d="M420 191 V211"/><path class="edge" d="M589 191 V211"/>
  <g data-layer="ability" data-player="1"><ellipse class="node ability" cx="82" cy="241" rx="58" ry="27"/><text class="main" x="82" y="248">θ<tspan dy="5" class="index">A</tspan></text></g>
  <g data-layer="ability" data-player="2"><ellipse class="node ability" cx="251" cy="241" rx="58" ry="27"/><text class="main" x="251" y="248">θ<tspan dy="5" class="index">B</tspan></text></g>
  <g data-layer="ability" data-player="3"><ellipse class="node ability" cx="420" cy="241" rx="58" ry="27"/><text class="main" x="420" y="248">θ<tspan dy="5" class="index">C</tspan></text></g>
  <g data-layer="ability" data-player="4"><ellipse class="node ability" cx="589" cy="241" rx="58" ry="27"/><text class="main" x="589" y="248">θ<tspan dy="5" class="index">D</tspan></text></g>
  <path class="edge" d="M82 268 V289"/><path class="edge" d="M251 268 V289"/>
  <path class="edge" d="M420 268 V289"/><path class="edge" d="M589 268 V289"/>
  <g data-layer="data" data-player="1"><rect class="node observed" x="14" y="292" width="136" height="42" rx="6"/><text class="main" x="82" y="319">Y<tspan class="index" dy="5">1A</tspan><tspan dy="-5">, Y</tspan><tspan class="index" dy="5">2A</tspan><tspan dy="-5">, …</tspan></text></g>
  <g data-layer="data" data-player="2"><rect class="node observed" x="183" y="292" width="136" height="42" rx="6"/><text class="main" x="251" y="319">Y<tspan class="index" dy="5">1B</tspan><tspan dy="-5">, Y</tspan><tspan class="index" dy="5">2B</tspan><tspan dy="-5">, …</tspan></text></g>
  <g data-layer="data" data-player="3"><rect class="node observed" x="352" y="292" width="136" height="42" rx="6"/><text class="main" x="420" y="319">Y<tspan class="index" dy="5">1C</tspan><tspan dy="-5">, Y</tspan><tspan class="index" dy="5">2C</tspan><tspan dy="-5">, …</tspan></text></g>
  <g data-layer="data" data-player="4"><rect class="node observed" x="521" y="292" width="136" height="42" rx="6"/><text class="main" x="589" y="319">Y<tspan class="index" dy="5">1D</tspan><tspan dy="-5">, Y</tspan><tspan class="index" dy="5">2D</tspan><tspan dy="-5">, …</tspan></text></g>
  <text class="small" x="335" y="365">Each at-bat is a hit (1) or a miss (0).</text>
  <rect class="plate" x="710" y="169" width="363" height="213" rx="7"/>
  <path class="edge" d="M891 150 V186"/>
  <g data-layer="ability"><rect class="node ability" x="759" y="189" width="264" height="41" rx="20"/><text class="main" x="891" y="216">θ<tspan dy="5" class="index">s</tspan><tspan dy="-5"> ∼ Beta(α, β)</tspan></text></g>
  <rect class="plate" x="735" y="247" width="312" height="98" rx="6"/>
  <path class="edge" d="M891 230 V263"/>
  <g data-layer="data"><rect class="node observed" x="754" y="266" width="275" height="39" rx="6"/><text class="main" x="891" y="292">Y<tspan dy="5" class="index">is</tspan><tspan dy="-5"> ∼ Bernoulli(θ</tspan><tspan dy="5" class="index">s</tspan><tspan dy="-5">)</tspan></text></g>
  <text class="small" x="891" y="332">At-bats i = 1, …, n<tspan class="index" dy="4">s</tspan></text>
  <text class="small" x="891" y="371">Players s = 1, …, S</text>
</svg>
  </div>
  <p>Each player’s hit count H is the sum of their individual 0/1 outcomes.</p>
</details>

</section>

<script>
"use strict";
const model = JSON.parse(document.getElementById("model-data").textContent);
const hierarchical = model.model === "hierarchical";
const byId = id => document.getElementById(id);
const groups = model.populations.map(pop => ({
  ...pop, players: model.players.filter(p => p.dataset === pop.dataset)
}));
const frames = model.frames;
const n = model.atBats;
const f3 = number => number.toFixed(3);
const quantity = (count, word, plural = word + "s") => count + " " + (count === 1 ? word : plural);
const shape = x => hierarchical ? x.toFixed(2) : String(x);
const beta = g => "Beta(" + shape(g.alpha) + ", " + shape(g.beta) + ")";
const chart = (type, group, player = 0) => model.charts[[type, group, player].join("-")];
const node = (tag, content, cls) => {
  const x = document.createElement(tag);
  if (content !== undefined) x.textContent = content;
  if (cls) x.className = cls;
  return x;
};
function figure(container, source, description) {
  if (source) {
    const shown = container.firstElementChild;
    if (shown && shown.tagName === "IMG" && shown.getAttribute("src") === source) {
      shown.alt = description;
      return;
    }
    const img = node("img");
    img.alt = description; img.src = source; img.width = 800; img.height = 365;
    container.replaceChildren(img);
  } else {
    container.replaceChildren(node("p", description, "placeholder"));
  }
}
function setPanel(id, formula, source, description, detail) {
  byId(id + "Formula").textContent = formula;
  figure(byId(id + "Fig"), source, description);
  byId(id + "Detail").textContent = detail;
}
function setStage(title, text) {
  byId("headline").textContent = title;
  byId("caption").textContent = text;
}
function makeTable(headers) {
  const table = node("table");
  const header = table.createTHead().insertRow();
  for (const name of headers) {
    const cell = node("th", name); cell.scope = "col"; header.append(cell);
  }
  return {table, body: table.createTBody()};
}
function dataRow(body, heading) {
  const row = body.insertRow();
  const cell = node("th", heading); cell.scope = "row"; row.append(cell);
  return row;
}
function renderRecords(g, frame) {
  const {table, body} = makeTable(["Player", ...g.players.map(p => p.label)]);
  table.className = "records";
  table.style.minWidth = (85 + 52 * g.players.length) + "px";
  for (const [key, label] of [["theta","Drawn θ"],["hits","Hits"],["misses","Misses"]]) {
    const row = dataRow(body, label);
    for (const p of g.players) {
      const reveal = p.player < frame.player ||
        (p.player === frame.player && (frame.stage === "hits" || key === "theta"));
      const value = !reveal ? "—" : key === "theta" ? f3(p.theta) : p[key];
      row.append(node("td", value, !reveal ? "pending" : p.player === frame.player ? "current" : ""));
    }
  }
  byId("ledgerTitle").textContent = "Dataset " + g.dataset + " · " + n + " at-bats per player";
  byId("ledger").replaceChildren(table);
}
function showHitCount(p) {
  const labels = node("div", undefined, "count-labels");
  labels.append(node("span", quantity(p.hits, "hit"), "hit-key"), node("span", quantity(p.misses, "miss", "misses")));
  const strip = node("div", undefined, "outcomes");
  strip.setAttribute("aria-hidden", "true");
  // These marks tally outcomes. The count draw supplies no ordering of at-bats.
  if (n <= 40) {
    for (let i = 0; i < n; i++) strip.append(node("span", undefined, i < p.hits ? "hit" : "miss"));
  } else {
    for (const [count, cls] of [[p.hits,"hit"],[p.misses,"miss"]]) {
      if (count) { const part = node("span", undefined, cls); part.style.flex = String(count); strip.append(part); }
    }
  }
  byId("countDetail").replaceChildren(labels, strip);
}
function renderDraw(frame) {
  const g = groups[frame.dataset - 1];
  const p = g.players[frame.player - 1];
  const stage = frame.stage;
  const hasMode = hierarchical && stage !== "begin";
  const hasPopulation = !hierarchical || !["begin","omega"].includes(stage);
  const hitDrawn = stage === "hits";
  const id = g.dataset;
  if (stage === "begin") {
    const caption = hierarchical
      ? (id === 1 ? "Start with the hyperprior for ω. The next step draws one mode for this dataset."
                  : "Return to the Beta(3, 7) hyperprior to draw a fresh shared mode for this dataset.")
      : "Every player in this dataset draws a new θ from the same fixed Beta(81, 219) distribution.";
    setStage("Begin simulated dataset " + id, caption);
  } else if (stage === "omega") {
    setStage("Draw the shared population mode",
      "Dataset " + id + " drew ω ≈ " + f3(g.omega) + ". This value applies to every player in the dataset.");
  } else if (stage === "population") {
    setStage("Set the population distribution",
      "The sampled ω determines both Beta shapes. With K = " + model.K + ", α = 1 + " +
      (model.K - 2) + "ω and β = 1 + " + (model.K - 2) + "(1 − ω).");
  } else if (stage === "theta") {
    setStage("Draw Player " + p.label + "’s hit probability",
      "Player " + p.label + " drew θ ≈ " + f3(p.theta) + ". This sets the Binomial probabilities for " + n + " at-bats.");
  } else {
    setStage("Draw Player " + p.label + "’s hit count",
      "Using this player’s θ, the Binomial draw gives " + quantity(p.hits, "hit") + " and " +
      quantity(p.misses, "miss", "misses") + " in " + quantity(n, "at-bat") + ".");
  }
  if (hierarchical) {
    byId("modeTitle").textContent = "Shared population mode ω";
    setPanel("mode", "ω ∼ Beta(3, 7)", chart("mode", hasMode ? id : 0),
      hasMode ? "Hyperprior density with the sampled mode at " + f3(g.omega) : "Beta(3, 7) hyperprior density.",
      hasMode ? "Dataset " + id + " uses ω ≈ " + f3(g.omega) + "." : "Draw once for the entire dataset.");
  } else {
    byId("modeTitle").textContent = "Fixed population parameters";
    byId("modeFormula").textContent = "Beta shape parameters";
    const shapes = node("div", undefined, "fixed-shapes");
    for (const [label, value] of [["α",g.alpha],["β",g.beta]]) {
      const item = node("div"); item.append(node("small", label), node("strong", value)); shapes.append(item);
    }
    byId("modeFig").replaceChildren(shapes);
    byId("modeDetail").textContent = "The population mean is 81 / 300 = 0.270.";
  }
  setPanel("ability", hasPopulation ? (hierarchical ? "θ | ω ∼ " : "θ ∼ ") + beta(g) : "θ | ω ∼ Beta(α, β)",
    hasPopulation ? chart("ability", id, frame.player) : null,
    hasPopulation ? "Population density" + (p ? " with the current θ marked at " + f3(p.theta) : " for the players in this dataset")
      : "The shared mode determines this curve.",
    !hasPopulation ? "K = 300 is fixed." : p ? "Player " + p.label + " drew θ ≈ " + f3(p.theta) + "."
      : "Each player draws their own θ from this curve.");
  setPanel("count", "H | θ ∼ Binomial(" + n + ", θ)",
    p ? chart(hitDrawn ? "outcome" : "chance", id, frame.player) : null,
    !p ? "Draw a player’s θ to see the possible hit counts." : hitDrawn ? "Binomial probabilities with " + p.hits + " hits marked."
      : "Binomial probabilities from 0 through " + n + " hits for θ ≈ " + f3(p.theta) + ".",
    p && !hitDrawn ? "The next step draws one count from these bars." : "");
  if (hitDrawn) showHitCount(p);
  renderRecords(g, frame);
}
function inferenceLink(g, seen = 0) {
  const counts = g.players.map(p => p.hits + "x" + p.at_bats).join("_");
  return "baseball_hierarchical_inference.html#counts=" + counts + "&seen=" + seen;
}
function renderSummary() {
  setStage("Population distributions across datasets", hierarchical
    ? "Each dataset drew its own ω. Each dot marks a player’s θ on that dataset’s population curve."
    : "All datasets used the same Beta(81, 219) curve. Each dot marks a fresh draw of a player’s θ.");
  const plots = byId("summary"); plots.replaceChildren();
  const headers = ["Dataset", ...(hierarchical ? ["Shared ω"] : []), "Total hits", "Total misses"];
  const {table, body} = makeTable(headers);
  for (const g of groups) {
    const panel = node("section", undefined, "panel ability");
    const formula = hierarchical ? "ω ≈ " + f3(g.omega) + "  ·  " + beta(g) : beta(g);
    const plot = node("div", undefined, "figure");
    figure(plot, chart("summary", g.dataset), "Player draws of θ: " + g.players.map(p => f3(p.theta)).join(", "));
    panel.append(node("h3", "Dataset " + g.dataset), node("p", formula, "formula"), plot); plots.append(panel);
    if (hierarchical) {
      const fit = node("a", "Infer from these players’ counts");
      fit.href = inferenceLink(g);
      panel.append(fit);
    }
    const row = dataRow(body, String(g.dataset));
    if (hierarchical) row.append(node("td", f3(g.omega)));
    row.append(node("td", g.players.reduce((s,p) => s+p.hits, 0)),
      node("td", g.players.reduce((s,p) => s+p.misses, 0)));
  }
  byId("ledgerTitle").textContent = "Observed totals · " + groups[0].players.length * n + " at-bats per dataset";
  byId("ledger").replaceChildren(table);
}
function linkedFrame() {
  const fragment = location.hash.slice(1);
  if (fragment === "summary") return frames.length - 1;
  const [group, player, stage] = fragment.split("-");
  const exact = frames.findIndex(f => f.dataset === Number(group) && f.player === Number(player) && f.stage === stage);
  if (exact >= 0) return exact;
  // In the fixed model the omega and population steps map to its dataset opening.
  const first = frames.findIndex(f => f.dataset === Number(group) && f.stage === "begin");
  return Math.max(0, first);
}
let current = linkedFrame(), timer = null;
const end = frames.length - 1;
byId("title").textContent = model.title;
byId("intro").textContent = hierarchical
  ? "One population mode sets the distribution of hit probabilities for a whole dataset of players."
  : "A fixed Beta distribution supplies each player’s hit probability in every simulated dataset.";
byId(hierarchical ? "navHier" : "navFixed").setAttribute("aria-current", "page");
byId("generationDiagram").setAttribute("data-model", model.model);
byId("seek").max = String(frames.length);
for (const [i,f] of frames.entries()) {
  if (f.stage === "begin" || f.stage === "summary") {
    byId("jump").add(new Option(f.stage === "summary" ? "Summary" : "Dataset " + f.dataset, String(i)));
  }
}
function render() {
  const f = frames[current];
  const summary = f.stage === "summary";
  const layer = {begin:hierarchical ? "mode" : "population",omega:"mode",population:"population",theta:"ability",hits:"data"}[f.stage];
  for (const group of byId("generationDiagram").querySelectorAll("[data-layer]")) {

  byId("jump").value = String(summary ? end : frames.findIndex(x => x.dataset === f.dataset && x.stage === "begin"));
  const fragment = summary ? "summary" : [f.dataset, f.player, f.stage].join("-");
  byId("navFixed").href = "beta_binomial_generation.html#" + fragment;
  byId("navHier").href = "hierarchical_beta_binomial_generation.html#" + fragment;
  byId("navInfer").href = hierarchical && !summary ? inferenceLink(groups[f.dataset - 1],
    f.stage === "hits" ? f.player : Math.max(0, f.player - 1)) : "baseball_hierarchical_inference.html";

function stop() { if (timer !== null) clearInterval(timer); timer = null; }

byId("prev").onclick = () => go(current-1); byId("next").onclick = () => go(current+1);

byId("jump").onchange = e => go(Number(e.target.value));
window.addEventListener("hashchange", () => go(linkedFrame()));

  else if (e.key === "Home") go(0); else if (e.key === "End") go(end);

  e.preventDefault();

render();
