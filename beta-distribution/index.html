<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore the Beta density with shape, mode, and concentration controls. Compare two densities on the same axes.">
  <title>Beta distribution explorer</title>
  <link rel="stylesheet" href="explorer.css">
  <script src="beta-tools.js" defer></script>
  <script src="explorer.js?v=2" defer></script>
</head>
<body>
  <main>
    <header class="page-heading">
      <h1>Beta distribution explorer</h1>
      <nav aria-label="Related tool"><a href="../bayesian-inference/">Bayesian inference</a></nav>
    </header>

    <div class="workspace">
      <section class="card controls" aria-labelledby="controls-title">
        <div class="card-heading">
          <h2 id="controls-title">Parameters</h2>
          <label class="compare">
            <input id="compare" type="checkbox" role="switch" aria-controls="second-controls">
            Compare
          </label>
        </div>
        <p class="control-hint">Use the arrow keys on a slider or type a value. Shape and concentration sliders use a log scale.</p>
        <div id="first-controls" class="parameter-set" data-series="1"></div>
        <div id="second-controls" class="parameter-set" data-series="2" hidden></div>
      </section>

      <section class="card plot-card" aria-labelledby="plot-title">
        <div class="card-heading">
          <h2 id="plot-title">Beta density</h2>
        </div>
        <canvas id="density-chart" role="img" aria-label="Beta density" aria-describedby="summaries">
          The mean and mode of each distribution are listed below.
        </canvas>
        <div class="summaries" id="summaries">
          <div id="first-summary" class="summary" data-series="1"></div>
          <div id="second-summary" class="summary" data-series="2" hidden></div>
        </div>
      </section>
    </div>
    <noscript><p>Enable JavaScript to change the parameters and draw the density.</p></noscript>
  </main>

  <template id="summary-template">
    <h3 class="series-heading" data-beta-label></h3>
    <dl>
      <div>
        <dt><span class="marker-key mean-key" aria-hidden="true"></span>Mean</dt>
        <dd data-mean></dd>
      </div>
      <div>
        <dt><span class="marker-key mode-key" aria-hidden="true"></span>Mode</dt>
        <dd data-mode></dd>
      </div>
    </dl>
    <p class="boundary-note" data-boundary hidden></p>
  </template>
</body>
</html>
